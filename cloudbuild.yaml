# Google Cloud Build -> Cloud Run Automated Deployment Pipeline for CoThread
steps:
  # 1. Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/cothread:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/cothread:latest'
      - '.'

  # 2. Push the container image to Container Registry / Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/cothread:$COMMIT_SHA'

  # 3. Deploy container image to Google Cloud Run with session affinity for WebSockets/SSE
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'cothread'
      - '--image'
      - 'gcr.io/$PROJECT_ID/cothread:$COMMIT_SHA'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'
      - '--session-affinity'
      - '--timeout'
      - '3600'
      - '--set-env-vars'
      - 'NODE_ENV=production'

substitutions:
  _REGION: us-central1

images:
  - 'gcr.io/$PROJECT_ID/cothread:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/cothread:latest'

options:
  logging: CLOUD_LOGGING_ONLY
