<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>CoThread — Collaborative AI Chat</title>
  <link rel="icon" type="image/svg+xml" href="./public/logo.svg?v=ct18" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./public/styles.css?v=ct18" />
</head>
<body>

  <!-- =========================================================================
       1. DUMMY LOGIN & SIGNUP PORTAL (Claude / Gemini Style)
       ========================================================================= -->
  <div class="auth-portal-root" id="authPortal">
    <div class="auth-portal-card">
      <div class="auth-portal-header">
        <img src="./public/logo.svg?v=ct18" width="56" height="56" alt="CoThread Logo" class="auth-logo" />
        <h1 class="auth-title">CoThread</h1>
        <p class="auth-subtitle">Real-time collaborative AI chat &bull; Like Google Docs for AI</p>
      </div>

      <div class="auth-invite-banner hidden" id="authInviteNotice">
        <span>🔗</span>
        <span id="authInviteNoticeText">You were invited to join a collaborative chat!</span>
      </div>

      <div class="auth-tabs">
        <button type="button" class="auth-tab-btn active" id="tabLoginBtn">Log In</button>
        <button type="button" class="auth-tab-btn" id="tabSignupBtn">Sign Up</button>
      </div>

      <!-- Login Form -->
      <form id="dummyLoginForm" class="auth-form">
        <div class="form-group">
          <label for="loginEmail">Email address</label>
          <input type="email" id="loginEmail" class="auth-input" placeholder="e.g. hasnain@cothread.ai" required />
        </div>
        <div class="form-group">
          <label for="loginPassword">Password</label>
          <input type="password" id="loginPassword" class="auth-input" placeholder="••••••••" value="demo123" />
        </div>
        <button type="submit" class="auth-submit-btn">Log In to Chat &rarr;</button>
      </form>

      <!-- Signup Form -->
      <form id="dummySignupForm" class="auth-form hidden">
        <div class="form-group">
          <label for="signupName">Full Name</label>
          <input type="text" id="signupName" class="auth-input" placeholder="e.g. Muhammad Hasnain" required />
        </div>
        <div class="form-group">
          <label for="signupEmail">Email address</label>
          <input type="email" id="signupEmail" class="auth-input" placeholder="e.g. hasnain@cothread.ai" required />
        </div>
        <div class="form-group">
          <label for="signupPassword">Password</label>
          <input type="password" id="signupPassword" class="auth-input" placeholder="••••••••" value="demo123" />
        </div>
        <button type="submit" class="auth-submit-btn">Create Account &rarr;</button>
      </form>

      <!-- Quick 1-Click Test Personas (for pair testing in multiple tabs) -->
      <div class="auth-divider">
        <span>or 1-click test login</span>
      </div>
      <div class="quick-test-profiles">
        <button type="button" class="quick-profile-btn" data-test-name="Muhammad Hasnain" data-test-email="hasnain@cothread.ai">
          <span class="avatar-circle hasnain">MH</span>
          <div class="quick-profile-info">
            <strong>Muhammad Hasnain</strong>
            <small>hasnain@cothread.ai</small>
          </div>
        </button>
        <button type="button" class="quick-profile-btn" data-test-name="Sarah Chen" data-test-email="sarah@cothread.ai">
          <span class="avatar-circle sarah">SC</span>
          <div class="quick-profile-info">
            <strong>Sarah Chen</strong>
            <small>sarah@cothread.ai</small>
          </div>
        </button>
        <button type="button" class="quick-profile-btn" data-test-name="Alex Rivera" data-test-email="alex@cothread.ai">
          <span class="avatar-circle alex">AR</span>
          <div class="quick-profile-info">
            <strong>Alex Rivera</strong>
            <small>alex@cothread.ai</small>
          </div>
        </button>
      </div>
    </div>
  </div>

  <!-- =========================================================================
       2. PRODUCTION COTHREAD WORKSPACE (/app & /s/:shareCode)
       ========================================================================= -->
  <div class="app-shell hidden" id="appShell">
    <header class="workspace-top-header">
      <div class="top-header-left">
        <button type="button" class="back-to-site-brand" id="backToWebsiteBtn" title="Return to Sign In">
          <img src="./public/logo.svg?v=ct18" width="32" height="32" alt="CoThread Logo" />
          <span class="wordmark-serif sm">CoThread</span>
        </button>

        <div class="model-selector-pill">
          <span class="sparkle-icon">&#x2726;</span>
          <select id="headerModelSelect" class="header-model-select" aria-label="Select CoThread AI Model">
            <option value="gemini-3.8-flash">Gemini 3.8 Flash (ADK)</option>
            <option value="gemini-4-argon">Gemini 4 Argon (ADK)</option>
          </select>
          <span class="flash-lite-tag">Flash-Lite</span>
        </div>
      </div>

      <div class="top-header-right">
        <div class="sync-status-pill" title="Live Collaborative Sync">
          <span class="live-pulse-dot"></span>
          <span id="syncStatusText">Live Sync</span>
        </div>

        <button type="button" class="header-utility-btn" id="appThemeToggleBtn" title="Toggle Theme">
          <span id="appThemeIcon">&#x2600;&#xFE0F;</span>
        </button>
      </div>
    </header>

    <main class="workspace-stage" id="workspaceStage"></main>
  </div>

  <div class="toast-container" id="toastContainer" aria-live="polite"></div>

  <script src="./src/core/quota-engine.js?v=ct18"></script>
  <script src="./src/ai/gemini-service.js?v=ct18"></script>
  <script src="./public/app.js?v=ct18"></script>
</body>
</html>
